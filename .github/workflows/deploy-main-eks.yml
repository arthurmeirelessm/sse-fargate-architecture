name: Deploy to EKS

on:
  push:
    branches:
      - main
    paths:
      - "poc/**"
      - ".github/workflows/deploy-main-eks.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'sse-poc' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'sse-poc-eks' }}
  KUBERNETES_NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE || 'sse-poc' }}
  KUBERNETES_DEPLOYMENT: ${{ vars.KUBERNETES_DEPLOYMENT || 'sse-poc-app' }}

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            poc/server/package-lock.json
            poc/sidecar/package-lock.json
            poc/client/package-lock.json

      - name: Install dependencies
        working-directory: poc
        run: |
          npm ci --prefix server
          npm ci --prefix sidecar
          npm ci --prefix client

      - name: Typecheck and test
        working-directory: poc
        run: |
          npm run typecheck --prefix server
          npm test --prefix server
          npm run typecheck --prefix sidecar
          npm run build --prefix client

      - name: Check AWS credential configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_ACCESS_KEY_ID_SECRET: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          if [ -n "$AWS_ROLE_TO_ASSUME" ]; then
            echo "Using AWS OIDC role: $AWS_ROLE_TO_ASSUME"
            exit 0
          fi

          if [ -n "$AWS_ACCESS_KEY_ID_SECRET" ] && [ -n "$AWS_SECRET_ACCESS_KEY_SECRET" ]; then
            echo "Using AWS access key secrets."
            exit 0
          fi

          echo "::error::Configure either AWS_ROLE_TO_ASSUME (recommended OIDC) or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY repository secrets."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app image
        working-directory: poc
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker build \
            -f Dockerfile.app \
            -t "$ECR_REGISTRY/$PROJECT_NAME-app:latest" \
            -t "$ECR_REGISTRY/$PROJECT_NAME-app:$IMAGE_TAG_SHA" \
            .

          docker push "$ECR_REGISTRY/$PROJECT_NAME-app:latest"
          docker push "$ECR_REGISTRY/$PROJECT_NAME-app:$IMAGE_TAG_SHA"

      - name: Build and push sidecar image
        working-directory: poc
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          docker build \
            -t "$ECR_REGISTRY/$PROJECT_NAME-mcp-stub:latest" \
            -t "$ECR_REGISTRY/$PROJECT_NAME-mcp-stub:$IMAGE_TAG_SHA" \
            ./sidecar

          docker push "$ECR_REGISTRY/$PROJECT_NAME-mcp-stub:latest"
          docker push "$ECR_REGISTRY/$PROJECT_NAME-mcp-stub:$IMAGE_TAG_SHA"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Deploy immutable images to EKS
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

          kubectl --namespace "$KUBERNETES_NAMESPACE" set image \
            "deployment/$KUBERNETES_DEPLOYMENT" \
            "app=$ECR_REGISTRY/$PROJECT_NAME-app:$IMAGE_TAG_SHA" \
            "mcp-stub=$ECR_REGISTRY/$PROJECT_NAME-mcp-stub:$IMAGE_TAG_SHA"

          kubectl --namespace "$KUBERNETES_NAMESPACE" rollout status \
            "deployment/$KUBERNETES_DEPLOYMENT" \
            --timeout=5m
