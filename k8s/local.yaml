apiVersion: v1
kind: Namespace
metadata:
  name: sse-poc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sse-poc-app
  namespace: sse-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sse-poc-app
  template:
    metadata:
      labels:
        app: sse-poc-app
    spec:
      containers:
        - name: app
          image: axis-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SIDECAR_URL
              value: "http://127.0.0.1:8061"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
        - name: mcp-stub
          image: axis-sidecar:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: sidecar
              containerPort: 8061
          env:
            - name: PORT
              value: "8061"
          readinessProbe:
            httpGet:
              path: /health
              port: sidecar
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sse-poc-app
  namespace: sse-poc
spec:
  selector:
    app: sse-poc-app
  ports:
    - name: http
      port: 8080
      targetPort: http